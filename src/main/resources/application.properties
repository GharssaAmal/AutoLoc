spring.application.name=autoloc-api


spring.datasource.url=jdbc:mysql://localhost:3306/autoloc?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate crée/met à jour les tables à partir des entités
spring.jpa.hibernate.ddl-auto=update
# Affiche le SQL dans les logs (indispensable pour observer LAZY/EAGER et les FK)
spring.jpa.show-sql=true
# Évite que la session reste ouverte pendant les requêtes web (nécessaire pour voir les LazyInitializationException)
spring.jpa.open-in-view=false